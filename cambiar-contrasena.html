<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambiar contraseña — RCIA-UADY</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="barra-superior">
  <div class="marca">RCIA-UADY · Gestión Editorial</div>
  <nav><a href="dashboard.html">Volver al panel</a></nav>
</div>
<main class="contenedor" style="max-width:540px;">
  <h1>Cambiar contraseña</h1>
  <p class="subtitulo">Si recibiste una contraseña inicial, cámbiala por una que solo tú conozcas.</p>
  <p id="cuenta-password"></p>
  <form id="form-password" class="tarjeta" hidden>
    <label for="password-actual">Contraseña actual</label>
    <input type="password" id="password-actual" autocomplete="current-password" required>
    <label for="password-nueva">Nueva contraseña</label>
    <input type="password" id="password-nueva" autocomplete="new-password" minlength="8" required aria-describedby="ayuda-password">
    <p id="ayuda-password" class="subtitulo" style="margin:8px 0;">Usa al menos 8 caracteres. No reutilices la contraseña de tu correo.</p>
    <label for="password-confirmar">Confirmar nueva contraseña</label>
    <input type="password" id="password-confirmar" autocomplete="new-password" minlength="8" required>
    <button type="submit" id="guardar-password">Guardar nueva contraseña</button>
  </form>
  <div id="aviso-password" role="status" aria-live="polite"></div>
  <p><a href="dashboard.html">Volver al panel</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/password.js"></script>
</body>
</html>
